<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>₍^. .^₎⟆ - Letters</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Georgia', serif;
            background: #f7f4ef;
            min-height: 100vh;
            padding: 50px 24px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .diary-entry {
            background: #ffffff;
            padding: 48px 56px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
            border: 1px solid #ece4d8;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid #ede6dc;
        }

        .envelope-icon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.7;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: -0.3px;
            color: #3d2b1a;
            margin-bottom: 8px;
        }

        .tagline {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            color: #a0846a;
            letter-spacing: 1px;
        }

        .mode-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .sort-control {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 11px;
            background: #f0ebe4;
            padding: 4px 12px;
            border-radius: 20px;
            color: #8b6f54;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .sort-btn {
            background: transparent;
            border: 1px solid #e0d5c8;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            color: #a0846a;
            cursor: pointer;
        }

        .sort-btn.active {
            background: #d4c3ae;
            color: #2c221a;
            border-color: #c4b094;
        }

        .sort-btn:hover:not(.active) {
            background: #e6dfd6;
        }

        .mode-badge {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 11px;
            background: #f0ebe4;
            padding: 4px 12px;
            border-radius: 20px;
            color: #8b6f54;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .unlock-btn {
            background: transparent;
            border: 1px solid #e0d5c8;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            color: #a0846a;
            cursor: pointer;
        }

        .unlock-btn:hover {
            background: #f0ebe4;
        }

        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .password-modal-content {
            background: white;
            padding: 32px;
            border-radius: 24px;
            max-width: 320px;
            text-align: center;
            border: 1px solid #ece4d8;
        }

        .password-modal-content h3 {
            font-family: 'Georgia', serif;
            color: #3d2b1a;
            margin-bottom: 20px;
        }

        .password-modal-content input {
            width: 100%;
            padding: 12px;
            font-family: monospace;
            font-size: 16px;
            border: 1px solid #e2d6ca;
            border-radius: 40px;
            margin-bottom: 16px;
            text-align: center;
        }

        .password-modal-content button {
            background: #d4c3ae;
            color: #2c221a;
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
        }

        .password-error {
            color: #b86b52;
            font-size: 12px;
            margin-top: 8px;
        }

        .letter-date {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 12px;
            color: #a0846a;
            margin-bottom: 32px;
            text-align: right;
            border-bottom: 1px dashed #ede6dc;
            padding-bottom: 12px;
        }

        .writing-area {
            margin-bottom: 32px;
            display: none;
        }

        .writing-area.visible {
            display: block;
        }

        .greeting {
            font-family: 'Georgia', serif;
            font-size: 17px;
            color: #3d2b1a;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .title-input {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            font-weight: 500;
            border: 1px solid #e2d6ca;
            background: #fefcf9;
            border-radius: 12px;
            margin: 8px 0;
            color: #2c221a;
        }

        textarea {
            width: 100%;
            padding: 20px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            line-height: 1.7;
            border: 1px solid #e2d6ca;
            background: #fefcf9;
            border-radius: 12px;
            margin: 8px 0;
            resize: vertical;
            color: #2c221a;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin: 16px 0 8px;
            flex-wrap: wrap;
        }

        button {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: #f0ebe4;
            color: #5c4430;
        }

        .btn-primary {
            background: #d4c3ae;
            color: #2c221a;
        }

        .btn-primary:hover {
            background: #c4b094;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f0ebe4;
            border: 1px solid #e0d5c8;
        }

        .entries-section {
            margin-top: 48px;
        }

        .section-title {
            font-family: 'Georgia', serif;
            font-size: 18px;
            font-weight: 400;
            color: #8b6f54;
            margin-bottom: 24px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before,
        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e8dfd4;
        }

        /* Letter preview card - clickable */
        .letter-preview {
            background: #fefcf9;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 16px;
            border: 1px solid #ece4d8;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .letter-preview:hover {
            border-color: #d4bba4;
            background: #ffffff;
            transform: translateX(4px);
        }

        .preview-title {
            font-family: 'Georgia', serif;
            font-size: 18px;
            font-weight: 500;
            color: #3d2b1a;
            margin-bottom: 12px;
        }

        .preview-date {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 10px;
            color: #b8a28c;
            margin-bottom: 12px;
        }

        .preview-excerpt {
            font-family: 'Georgia', serif;
            font-size: 14px;
            line-height: 1.5;
            color: #8b7355;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }

        body.read-mode .action-buttons {
            display: none;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid #e8ddd2;
            color: #bfaa95;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #f5ede6;
            border-color: #d4bba4;
            color: #a07754;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #f0e8e0;
            flex-wrap: wrap;
        }

        .pagination-btn {
            background: transparent;
            border: 1px solid #e0d5c8;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 30px;
            color: #a0846a;
            cursor: pointer;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #f0ebe4;
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-numbers {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .page-number {
            background: transparent;
            border: 1px solid #e0d5c8;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 30px;
            color: #a0846a;
            cursor: pointer;
            min-width: 36px;
            text-align: center;
        }

        .page-number.active {
            background: #d4c3ae;
            color: #2c221a;
            border-color: #c4b094;
        }

        .page-jump {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-jump input {
            width: 60px;
            padding: 6px 8px;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #e2d6ca;
            border-radius: 30px;
            text-align: center;
        }

        .page-info {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 11px;
            color: #b8a28c;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            background: #fefcf9;
            border-radius: 16px;
            border: 1px dashed #e0d4c8;
            color: #b8a694;
        }

        .status {
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 13px;
            text-align: center;
            margin: 16px 0;
        }
        .status-loading { background: #f0ebe4; color: #8b6f54; }
        .status-error { background: #fef0ed; color: #b86b52; }
        .status-success { background: #edf3ea; color: #6f8f5c; }

        @media (max-width: 600px) {
            body { padding: 24px 16px; }
            .diary-entry { padding: 28px 20px; }
            .letter-preview { padding: 18px 20px; }
            .preview-title { font-size: 16px; }
            .mode-area { flex-direction: column; align-items: stretch; }
            .sort-control, .mode-badge { justify-content: center; }
            .pagination { flex-direction: column; align-items: center; }
            .page-jump { margin-left: 0; }
        }
    </style>
</head>
<body class="read-mode">
    <div class="container">
        <div class="diary-entry">
            <div class="header">
                <div class="envelope-icon">✉️</div>
                <h1>₍^. .^₎⟆</h1>
                <div class="tagline">For my friend</div>
            </div>

            <div class="mode-area">
                <div class="sort-control">
                    <span>📖 Sort by:</span>
                    <button id="sortNewestBtn" class="sort-btn active" onclick="setSortOrder('newest')">Newest First</button>
                    <button id="sortOldestBtn" class="sort-btn" onclick="setSortOrder('oldest')">Oldest First</button>
                </div>
                <div class="mode-badge">
                    <span id="modeText">Read Only</span>
                    <button class="unlock-btn" onclick="showPasswordModal()">Unlock</button>
                </div>
            </div>

            <div id="passwordModal" class="password-modal">
                <div class="password-modal-content">
                    <h3>Enter Password</h3>
                    <input type="password" id="passwordInput" placeholder="password" autocomplete="off">
                    <button onclick="checkPassword()">Unlock Write Mode</button>
                    <div id="passwordError" class="password-error"></div>
                </div>
            </div>

            <div class="letter-date" id="currentDate"></div>

            <div id="writingArea" class="writing-area">
                <div class="greeting">Dear friend,</div>
                <input type="text" id="letterTitle" class="title-input" placeholder="Letter title (optional)">
                <textarea id="diaryEntry" rows="7" placeholder="Write here..."></textarea>
                <div class="button-group">
                    <button class="btn-primary" onclick="saveEntry()">Save</button>
                    <button class="btn-secondary" onclick="loadEntries()">Refresh</button>
                </div>
            </div>

            <div id="status"></div>

            <div class="entries-section">
                <div class="section-title">Saved Messages 😼</div>
                <div id="entriesList"></div>
                
                <div id="paginationControls" class="pagination" style="display: none;">
                    <button class="pagination-btn" id="prevPageBtn" onclick="goToPreviousPage()">← Previous</button>
                    <div class="page-numbers" id="pageNumbers"></div>
                    <button class="pagination-btn" id="nextPageBtn" onclick="goToNextPage()">Next →</button>
                    <div class="page-jump">
                        <span class="page-info">Go to page</span>
                        <input type="number" id="pageNumberInput" min="1" value="1">
                        <button onclick="goToPage()">Go</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WRITE_PASSWORD = "KeyLock";
        const ITEMS_PER_PAGE = 6;
        
        const BIN_ID = "69d5b340856a6821890cdbfd";      
        const API_KEY = "$2a$10$C32wnSCGBNKjDww3OFHAtedCX0dUnscUKzf8ZS8F65GeyLo1bgF6C";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        
        let currentEntries = [];
        let isWriteMode = false;
        let currentSortOrder = 'newest';
        let currentPage = 1;

        const today = new Date();
        document.getElementById('currentDate').textContent = today.toLocaleDateString('en-US', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });

        function setSortOrder(order) {
            currentSortOrder = order;
            currentPage = 1;
            const newestBtn = document.getElementById('sortNewestBtn');
            const oldestBtn = document.getElementById('sortOldestBtn');
            if (order === 'newest') {
                newestBtn.classList.add('active');
                oldestBtn.classList.remove('active');
            } else {
                oldestBtn.classList.add('active');
                newestBtn.classList.remove('active');
            }
            displayEntries();
        }

        function getSortedEntries() {
            const sorted = [...currentEntries];
            if (currentSortOrder === 'newest') {
                return sorted.sort((a, b) => new Date(b.date) - new Date(a.date));
            } else {
                return sorted.sort((a, b) => new Date(a.date) - new Date(b.date));
            }
        }

        function getCurrentPageEntries() {
            const sortedEntries = getSortedEntries();
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            return sortedEntries.slice(startIndex, startIndex + ITEMS_PER_PAGE);
        }

        function getTotalPages() {
            return Math.ceil(currentEntries.length / ITEMS_PER_PAGE);
        }

        function getPreviewText(text, maxLength = 80) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }

        function updatePaginationControls() {
            const totalPages = getTotalPages();
            const paginationDiv = document.getElementById('paginationControls');
            if (totalPages <= 1) {
                paginationDiv.style.display = 'none';
                return;
            }
            paginationDiv.style.display = 'flex';
            
            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage === totalPages;
            
            const pageNumbersDiv = document.getElementById('pageNumbers');
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);
            let html = '';
            
            if (startPage > 1) {
                html += `<button class="page-number" onclick="goToPageNumber(1)">1</button>`;
                if (startPage > 2) html += `<span class="page-info">...</span>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-number ${i === currentPage ? 'active' : ''}" onclick="goToPageNumber(${i})">${i}</button>`;
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span class="page-info">...</span>`;
                html += `<button class="page-number" onclick="goToPageNumber(${totalPages})">${totalPages}</button>`;
            }
            pageNumbersDiv.innerHTML = html;
            document.getElementById('pageNumberInput').value = currentPage;
            document.getElementById('pageNumberInput').max = totalPages;
        }

        function goToPageNumber(page) {
            const totalPages = getTotalPages();
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            displayEntries();
        }

        function goToPreviousPage() {
            if (currentPage > 1) { currentPage--; displayEntries(); }
        }

        function goToNextPage() {
            const totalPages = getTotalPages();
            if (currentPage < totalPages) { currentPage++; displayEntries(); }
        }

        function goToPage() {
            let page = parseInt(document.getElementById('pageNumberInput').value);
            const totalPages = getTotalPages();
            if (isNaN(page)) page = 1;
            page = Math.min(Math.max(1, page), totalPages);
            currentPage = page;
            displayEntries();
        }

        function openLetter(globalIndex) {
            const sortedEntries = getSortedEntries();
            const letter = sortedEntries[globalIndex];
            if (letter) {
                localStorage.setItem('allLetters', JSON.stringify(currentEntries));
                localStorage.setItem('currentSortOrder', currentSortOrder);
                window.location.href = `LettersToElisa.html?id=${letter.id}&index=${globalIndex}`;
            }
        }

        function showPasswordModal() {
            document.getElementById('passwordModal').style.display = 'flex';
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordError').textContent = '';
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        function checkPassword() {
            if (document.getElementById('passwordInput').value === WRITE_PASSWORD) {
                closePasswordModal();
                enableWriteMode();
            } else {
                document.getElementById('passwordError').textContent = 'Incorrect password';
            }
        }

        function enableWriteMode() {
            isWriteMode = true;
            document.body.classList.remove('read-mode');
            document.getElementById('writingArea').classList.add('visible');
            document.getElementById('modeText').textContent = 'Write Mode';
            showStatus('Write mode unlocked!', 'success');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('passwordModal');
            if (event.target === modal) closePasswordModal();
        }

        function showStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('status');
            const typeClass = type === 'loading' ? 'status-loading' : (type === 'error' ? 'status-error' : 'status-success');
            statusDiv.innerHTML = `<div class="status ${typeClass}">${message}</div>`;
            setTimeout(() => { if (statusDiv.firstChild) statusDiv.innerHTML = ''; }, 3000);
        }

        async function saveToCloud(entries) {
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ entries: entries })
            });
            return response.ok;
        }

        async function loadEntries() {
            showStatus('Opening your letters...', 'loading');
            try {
                const response = await fetch(API_URL, { headers: { 'X-Master-Key': API_KEY } });
                const data = await response.json();
                currentEntries = data.record.entries || [];
                displayEntries();
                showStatus(`${currentEntries.length} ${currentEntries.length === 1 ? 'letter' : 'letters'} saved`, 'success');
            } catch (error) {
                showStatus('Could not load letters.', 'error');
            }
        }

        async function saveEntry() {
            if (!isWriteMode) { showStatus('Unlock write mode first', 'error'); return; }
            const title = document.getElementById('letterTitle').value.trim();
            const text = document.getElementById('diaryEntry').value;
            if (!text.trim()) { showStatus('Write something before saving', 'error'); return; }
            const newEntry = { id: Date.now(), title: title || "Untitled letter", date: new Date().toLocaleString(), text: text };
            currentEntries.push(newEntry);
            showStatus('Saving...', 'loading');
            try {
                await saveToCloud(currentEntries);
                document.getElementById('letterTitle').value = '';
                document.getElementById('diaryEntry').value = '';
                if (currentSortOrder === 'newest') currentPage = 1;
                else currentPage = getTotalPages();
                displayEntries();
                showStatus('Letter saved! Mrow!', 'success');
            } catch (error) { showStatus('Failed to save.', 'error'); }
        }

        async function deleteEntry(globalIndex) {
            if (!isWriteMode) { showStatus('Unlock write mode first', 'error'); return; }
            const sortedEntries = getSortedEntries();
            const actualEntry = sortedEntries[globalIndex];
            const actualIndex = currentEntries.findIndex(e => e.id === actualEntry.id);
            if (confirm('Delete this letter?')) {
                currentEntries.splice(actualIndex, 1);
                try {
                    await saveToCloud(currentEntries);
                    const totalPages = getTotalPages();
                    if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
                    else if (totalPages === 0) currentPage = 1;
                    displayEntries();
                    showStatus('Letter deleted', 'success');
                } catch (error) { showStatus('Delete failed.', 'error'); }
            }
        }

        function displayEntries() {
            const container = document.getElementById('entriesList');
            if (currentEntries.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><p>No letters yet. Write your first unsent letter above.</p></div>`;
                updatePaginationControls();
                return;
            }
            
            const sortedEntries = getSortedEntries();
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageEntries = sortedEntries.slice(startIndex, startIndex + ITEMS_PER_PAGE);
            const globalStartIndex = startIndex;
            
            container.innerHTML = pageEntries.map((entry, idx) => {
                const globalIndex = globalStartIndex + idx;
                const preview = getPreviewText(entry.text, 100);
                return `
                    <div class="letter-preview" onclick="openLetter(${globalIndex})">
                        <div class="preview-title">${escapeHtml(entry.title || 'Untitled letter')}</div>
                        <div class="preview-date">📅 ${entry.date}</div>
                        <div class="preview-excerpt">${escapeHtml(preview)}</div>
                        <div class="action-buttons">
                            <button class="delete-btn" onclick="event.stopPropagation(); deleteEntry(${globalIndex})">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
            updatePaginationControls();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadEntries();
    </script>
</body>
</html>
