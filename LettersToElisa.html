<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>₍^. .^₎⟆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Georgia', serif;
            background: #f7f4ef;
            min-height: 100vh;
            padding: 50px 24px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        /* Main letter card */
        .diary-entry {
            background: #ffffff;
            padding: 48px 56px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
            border: 1px solid #ece4d8;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid #ede6dc;
        }

        .envelope-icon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.7;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: -0.3px;
            color: #3d2b1a;
            margin-bottom: 8px;
        }

        .tagline {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            color: #a0846a;
            letter-spacing: 1px;
        }

        /* Mode toggle area */
        .mode-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .sort-control {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 11px;
            background: #f0ebe4;
            padding: 4px 12px;
            border-radius: 20px;
            color: #8b6f54;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .sort-btn {
            background: transparent;
            border: 1px solid #e0d5c8;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            color: #a0846a;
            cursor: pointer;
        }

        .sort-btn.active {
            background: #d4c3ae;
            color: #2c221a;
            border-color: #c4b094;
        }

        .sort-btn:hover:not(.active) {
            background: #e6dfd6;
        }

        .mode-badge {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 11px;
            background: #f0ebe4;
            padding: 4px 12px;
            border-radius: 20px;
            color: #8b6f54;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .unlock-btn {
            background: transparent;
            border: 1px solid #e0d5c8;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            color: #a0846a;
            cursor: pointer;
        }

        .unlock-btn:hover {
            background: #f0ebe4;
        }

        /* Password modal */
        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .password-modal-content {
            background: white;
            padding: 32px;
            border-radius: 24px;
            max-width: 320px;
            text-align: center;
            border: 1px solid #ece4d8;
        }

        .password-modal-content h3 {
            font-family: 'Georgia', serif;
            color: #3d2b1a;
            margin-bottom: 20px;
        }

        .password-modal-content input {
            width: 100%;
            padding: 12px;
            font-family: monospace;
            font-size: 16px;
            border: 1px solid #e2d6ca;
            border-radius: 40px;
            margin-bottom: 16px;
            text-align: center;
        }

        .password-modal-content input:focus {
            outline: none;
            border-color: #b8a28c;
        }

        .password-modal-content button {
            background: #d4c3ae;
            color: #2c221a;
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
        }

        .password-error {
            color: #b86b52;
            font-size: 12px;
            margin-top: 8px;
        }

        /* Date line */
        .letter-date {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 12px;
            color: #a0846a;
            margin-bottom: 32px;
            text-align: right;
            border-bottom: 1px dashed #ede6dc;
            padding-bottom: 12px;
        }

        /* Writing area */
        .writing-area {
            margin-bottom: 32px;
            display: none;
        }

        .writing-area.visible {
            display: block;
        }

        .greeting {
            font-family: 'Georgia', serif;
            font-size: 17px;
            color: #3d2b1a;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .title-input {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            font-weight: 500;
            border: 1px solid #e2d6ca;
            background: #fefcf9;
            border-radius: 12px;
            margin: 8px 0;
            color: #2c221a;
        }

        .title-input:focus {
            outline: none;
            border-color: #b8a28c;
            background: #ffffff;
        }

        .title-input::placeholder {
            color: #c9bcab;
            font-style: italic;
            font-size: 14px;
            font-weight: normal;
        }

        textarea {
            width: 100%;
            padding: 20px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            line-height: 1.7;
            border: 1px solid #e2d6ca;
            background: #fefcf9;
            border-radius: 12px;
            margin: 8px 0;
            resize: vertical;
            color: #2c221a;
        }

        textarea:focus {
            outline: none;
            border-color: #b8a28c;
            background: #ffffff;
        }

        textarea::placeholder {
            color: #c9bcab;
            font-style: italic;
            font-size: 14px;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
            margin: 16px 0 8px;
            flex-wrap: wrap;
        }

        button {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: #f0ebe4;
            color: #5c4430;
        }

        .btn-primary {
            background: #d4c3ae;
            color: #2c221a;
        }

        .btn-primary:hover {
            background: #c4b094;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f0ebe4;
            border: 1px solid #e0d5c8;
        }

        .btn-secondary:hover {
            background: #e6dfd6;
        }

        /* Entries section */
        .entries-section {
            margin-top: 48px;
        }

        .section-title {
            font-family: 'Georgia', serif;
            font-size: 18px;
            font-weight: 400;
            color: #8b6f54;
            margin-bottom: 24px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before,
        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e8dfd4;
        }

        /* Each letter entry */
        .letter-entry {
            background: #fefcf9;
            border-radius: 16px;
            padding: 28px 32px;
            margin-bottom: 20px;
            border: 1px solid #ece4d8;
            transition: all 0.2s ease;
        }

        .letter-entry:hover {
            border-color: #d9ccbc;
            background: #ffffff;
        }

        .letter-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0e8e0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .letter-title {
            font-family: 'Georgia', serif;
            font-size: 18px;
            font-weight: 500;
            color: #3d2b1a;
            flex: 1;
        }

        .letter-date-display {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 11px;
            color: #b8a28c;
        }

        .letter-content {
            font-family: 'Georgia', serif;
            font-size: 15px;
            line-height: 1.75;
            color: #3a3028;
            white-space: pre-wrap;
        }

        /* Hidden action buttons in read mode */
        .action-buttons {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 16px;
            gap: 8px;
        }

        body.read-mode .action-buttons {
            display: none;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid #e8ddd2;
            color: #bfaa95;
            font-size: 12px;
            padding: 5px 14px;
            border-radius: 30px;
        }

        .delete-btn:hover {
            background: #f5ede6;
            border-color: #d4bba4;
            color: #a07754;
            transform: none;
        }

        /* Pagination styles */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #f0e8e0;
            flex-wrap: wrap;
        }

        .pagination-btn {
            background: transparent;
            border: 1px solid #e0d5c8;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 30px;
            color: #a0846a;
            cursor: pointer;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #f0ebe4;
            border-color: #c4b094;
            color: #5c4430;
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-numbers {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .page-number {
            background: transparent;
            border: 1px solid #e0d5c8;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 30px;
            color: #a0846a;
            cursor: pointer;
            min-width: 36px;
            text-align: center;
        }

        .page-number.active {
            background: #d4c3ae;
            color: #2c221a;
            border-color: #c4b094;
        }

        .page-number:hover:not(.active) {
            background: #f0ebe4;
        }

        .page-jump {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 8px;
        }

        .page-jump input {
            width: 60px;
            padding: 6px 8px;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #e2d6ca;
            border-radius: 30px;
            text-align: center;
        }

        .page-jump input:focus {
            outline: none;
            border-color: #b8a28c;
        }

        .page-jump button {
            background: transparent;
            border: 1px solid #e0d5c8;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 30px;
            color: #a0846a;
            cursor: pointer;
        }

        .page-jump button:hover {
            background: #f0ebe4;
        }

        .page-info {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 11px;
            color: #b8a28c;
            margin-right: 8px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            background: #fefcf9;
            border-radius: 16px;
            border: 1px dashed #e0d4c8;
            color: #b8a694;
        }

        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state p {
            font-family: 'Georgia', serif;
            font-size: 14px;
            font-style: italic;
        }

        /* Status messages */
        .status {
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 13px;
            text-align: center;
            margin: 16px 0;
        }
        .status-loading { background: #f0ebe4; color: #8b6f54; }
        .status-error { background: #fef0ed; color: #b86b52; }
        .status-success { background: #edf3ea; color: #6f8f5c; }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
            }
            .diary-entry {
                padding: 28px 20px;
            }
            .letter-entry {
                padding: 20px;
            }
            .letter-title {
                font-size: 16px;
            }
            .button-group button {
                padding: 8px 16px;
                font-size: 13px;
            }
            .mode-area {
                flex-direction: column;
                align-items: stretch;
            }
            .sort-control {
                justify-content: center;
            }
            .mode-badge {
                justify-content: center;
            }
            .pagination {
                flex-direction: column;
                align-items: center;
            }
            .page-jump {
                margin-left: 0;
            }
        }
    </style>
</head>
<body class="read-mode">
    <div class="container">
        <div class="diary-entry">
            <div class="header">
                <div class="envelope-icon">✉️</div>
                <h1>₍^. .^₎⟆</h1>
                <div class="tagline">For my friend</div>
            </div>

            <!-- Mode area with sort controls -->
            <div class="mode-area">
                <div class="sort-control">
                    <span>📖 Sort by:</span>
                    <button id="sortNewestBtn" class="sort-btn active" onclick="setSortOrder('newest')">Newest First</button>
                    <button id="sortOldestBtn" class="sort-btn" onclick="setSortOrder('oldest')">Oldest First</button>
                </div>
                <div class="mode-badge">
                    <span id="modeText">Read Only</span>
                    <button class="unlock-btn" onclick="showPasswordModal()">Unlock</button>
                </div>
            </div>

            <!-- Password Modal -->
            <div id="passwordModal" class="password-modal">
                <div class="password-modal-content">
                    <h3>Enter Password</h3>
                    <input type="password" id="passwordInput" placeholder="password" autocomplete="off">
                    <button onclick="checkPassword()">Unlock Write Mode</button>
                    <div id="passwordError" class="password-error"></div>
                </div>
            </div>

            <div class="letter-date" id="currentDate"></div>

            <!-- Writing area (hidden until unlocked) -->
            <div id="writingArea" class="writing-area">
                <div class="greeting">Dear friend,</div>
                <input type="text" id="letterTitle" class="title-input" placeholder="Letter title (optional)">
                <textarea id="diaryEntry" rows="7" placeholder="Write here..."></textarea>
                <div class="button-group">
                    <button class="btn-primary" onclick="saveEntry()">Save</button>
                    <button class="btn-secondary" onclick="loadEntries()">Refresh</button>
                </div>
            </div>

            <div id="status"></div>

            <div class="entries-section">
                <div class="section-title">Saved Messages 😼</div>
                <div id="entriesList"></div>
                
                <!-- Pagination controls -->
                <div id="paginationControls" class="pagination" style="display: none;">
                    <button class="pagination-btn" id="prevPageBtn" onclick="goToPreviousPage()">← Previous</button>
                    <div class="page-numbers" id="pageNumbers"></div>
                    <button class="pagination-btn" id="nextPageBtn" onclick="goToNextPage()">Next →</button>
                    <div class="page-jump">
                        <span class="page-info">Go to page</span>
                        <input type="number" id="pageNumberInput" min="1" value="1">
                        <button onclick="goToPage()">Go</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🔐 SET YOUR PASSWORD HERE
        const WRITE_PASSWORD = "KeyLock";
        
        // Pagination settings
        const ITEMS_PER_PAGE = 3;
        
        // JSONBin credentials
        const BIN_ID = "69d5b340856a6821890cdbfd";      
        const API_KEY = "$2a$10$C32wnSCGBNKjDww3OFHAtedCX0dUnscUKzf8ZS8F65GeyLo1bgF6C";
        
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        
        let currentEntries = [];
        let isWriteMode = false;
        let currentSortOrder = 'newest';
        let currentPage = 1;

        // Set current date
        const today = new Date();
        document.getElementById('currentDate').textContent = today.toLocaleDateString('en-US', { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
        });

        function setSortOrder(order) {
            currentSortOrder = order;
            currentPage = 1; // Reset to first page when sorting changes
            
            const newestBtn = document.getElementById('sortNewestBtn');
            const oldestBtn = document.getElementById('sortOldestBtn');
            
            if (order === 'newest') {
                newestBtn.classList.add('active');
                oldestBtn.classList.remove('active');
                showStatus('Showing newest letters first', 'success');
            } else {
                oldestBtn.classList.add('active');
                newestBtn.classList.remove('active');
                showStatus('Showing oldest letters first', 'success');
            }
            
            displayEntries();
        }

        function getSortedEntries() {
            const sorted = [...currentEntries];
            if (currentSortOrder === 'newest') {
                return sorted.sort((a, b) => new Date(b.date) - new Date(a.date));
            } else {
                return sorted.sort((a, b) => new Date(a.date) - new Date(b.date));
            }
        }

        function getCurrentPageEntries() {
            const sortedEntries = getSortedEntries();
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            return sortedEntries.slice(startIndex, endIndex);
        }

        function getTotalPages() {
            return Math.ceil(currentEntries.length / ITEMS_PER_PAGE);
        }

        function updatePaginationControls() {
            const totalPages = getTotalPages();
            const paginationDiv = document.getElementById('paginationControls');
            const pageNumbersDiv = document.getElementById('pageNumbers');
            
            if (totalPages <= 1) {
                paginationDiv.style.display = 'none';
                return;
            }
            
            paginationDiv.style.display = 'flex';
            
            // Update Previous/Next buttons
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
            
            // Generate page numbers
            let pageNumbersHtml = '';
            
            // Show limited page numbers for cleaner display
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);
            
            // Add first page if not in range
            if (startPage > 1) {
                pageNumbersHtml += `<button class="page-number" onclick="goToPageNumber(1)">1</button>`;
                if (startPage > 2) {
                    pageNumbersHtml += `<span class="page-info" style="margin: 0 4px;">...</span>`;
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                pageNumbersHtml += `<button class="page-number ${i === currentPage ? 'active' : ''}" onclick="goToPageNumber(${i})">${i}</button>`;
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    pageNumbersHtml += `<span class="page-info" style="margin: 0 4px;">...</span>`;
                }
                pageNumbersHtml += `<button class="page-number" onclick="goToPageNumber(${totalPages})">${totalPages}</button>`;
            }
            
            pageNumbersDiv.innerHTML = pageNumbersHtml;
            
            // Update page input
            const pageInput = document.getElementById('pageNumberInput');
            pageInput.value = currentPage;
            pageInput.max = totalPages;
        }

        function goToPageNumber(page) {
            const totalPages = getTotalPages();
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            displayEntries();
        }

        function goToPreviousPage() {
            if (currentPage > 1) {
                currentPage--;
                displayEntries();
            }
        }

        function goToNextPage() {
            const totalPages = getTotalPages();
            if (currentPage < totalPages) {
                currentPage++;
                displayEntries();
            }
        }

        function goToPage() {
            const input = document.getElementById('pageNumberInput');
            let page = parseInt(input.value);
            const totalPages = getTotalPages();
            
            if (isNaN(page)) page = 1;
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            
            currentPage = page;
            displayEntries();
        }

        function showPasswordModal() {
            document.getElementById('passwordModal').style.display = 'flex';
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordError').textContent = '';
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            if (password === WRITE_PASSWORD) {
                closePasswordModal();
                enableWriteMode();
            } else {
                document.getElementById('passwordError').textContent = 'Incorrect password';
            }
        }

        function enableWriteMode() {
            isWriteMode = true;
            document.body.classList.remove('read-mode');
            document.getElementById('writingArea').classList.add('visible');
            document.getElementById('modeText').textContent = 'Write Mode';
            showStatus('Write mode unlocked! You can now add and delete letters.', 'success');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('passwordModal');
            if (event.target === modal) {
                closePasswordModal();
            }
        }

        function showStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('status');
            let typeClass = '';
            if (type === 'loading') typeClass = 'status-loading';
            if (type === 'error') typeClass = 'status-error';
            if (type === 'success') typeClass = 'status-success';
            
            statusDiv.innerHTML = `<div class="status ${typeClass}">${message}</div>`;
            setTimeout(() => {
                if (statusDiv.firstChild === statusDiv.firstChild) {
                    statusDiv.innerHTML = '';
                }
            }, 3000);
        }

        async function saveToCloud(entries) {
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ entries: entries })
            });
            return response.ok;
        }

        async function loadEntries() {
            showStatus('Opening your letters...', 'loading');
            try {
                const response = await fetch(API_URL, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await response.json();
                currentEntries = data.record.entries || [];
                displayEntries();
                const count = currentEntries.length;
                showStatus(`${count} ${count === 1 ? 'letter' : 'letters'} saved`, 'success');
            } catch (error) {
                console.error(error);
                showStatus('Could not load letters. Check your connection.', 'error');
            }
        }

        async function saveEntry() {
            if (!isWriteMode) {
                showStatus('Unlock write mode first', 'error');
                return;
            }
            
            const title = document.getElementById('letterTitle').value.trim();
            const text = document.getElementById('diaryEntry').value;
            
            if (!text.trim()) {
                showStatus('Write something before saving', 'error');
                return;
            }

            const newEntry = {
                id: Date.now(),
                title: title || "Untitled letter",
                date: new Date().toLocaleString(),
                text: text
            };

            currentEntries.push(newEntry);
            
            showStatus('Saving your letter...', 'loading');
            try {
                await saveToCloud(currentEntries);
                document.getElementById('letterTitle').value = '';
                document.getElementById('diaryEntry').value = '';
                
                // After saving, go to first page to see the new letter
                if (currentSortOrder === 'newest') {
                    currentPage = 1;
                } else {
                    // If sorting oldest first, go to last page
                    const totalPages = Math.ceil(currentEntries.length / ITEMS_PER_PAGE);
                    currentPage = totalPages;
                }
                displayEntries();
                showStatus('Letter saved! Mrow!', 'success');
            } catch (error) {
                showStatus('Failed to save. Please try again.', 'error');
            }
        }

        async function deleteEntry(index) {
            if (!isWriteMode) {
                showStatus('Unlock write mode to delete letters', 'error');
                return;
            }
            
            // Get the actual entry from current page
            const currentPageEntries = getCurrentPageEntries();
            const actualEntry = currentPageEntries[index];
            const actualIndex = currentEntries.findIndex(entry => entry.id === actualEntry.id);
            
            if (confirm('Delete this letter? This cannot be undone.')) {
                currentEntries.splice(actualIndex, 1);
                showStatus('Removing letter...', 'loading');
                try {
                    await saveToCloud(currentEntries);
                    
                    // Adjust current page if needed
                    const totalPages = getTotalPages();
                    if (currentPage > totalPages && totalPages > 0) {
                        currentPage = totalPages;
                    } else if (totalPages === 0) {
                        currentPage = 1;
                    }
                    
                    displayEntries();
                    showStatus('Letter deleted', 'success');
                } catch (error) {
                    showStatus('Delete failed. Please try again.', 'error');
                    loadEntries();
                }
            }
        }

        function displayEntries() {
            const container = document.getElementById('entriesList');
            if (currentEntries.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No letters yet. Write your first unsent letter above.</p>
                    </div>
                `;
                updatePaginationControls();
                return;
            }
            
            const currentPageEntries = getCurrentPageEntries();
            
            if (currentPageEntries.length === 0 && currentPage > 1) {
                // If current page has no entries, go to last page
                currentPage = getTotalPages();
                displayEntries();
                return;
            }
            
            container.innerHTML = currentPageEntries.map((entry, displayIndex) => `
                <div class="letter-entry">
                    <div class="letter-meta">
                        <div class="letter-title">${escapeHtml(entry.title || 'Untitled letter')}</div>
                        <div class="letter-date-display">📅 ${entry.date}</div>
                    </div>
                    <div class="letter-content">${escapeHtml(entry.text).replace(/\n/g, '<br>')}</div>
                    <div class="action-buttons">
                        <button class="delete-btn" onclick="deleteEntry(${displayIndex})">Delete</button>
                    </div>
                </div>
            `).join('');
            
            updatePaginationControls();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load entries when page opens
        loadEntries();
    </script>
</body>
</html>
